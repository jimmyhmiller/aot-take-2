[package]
name         = "aot"
entry        = "src/main.coil"
source-roots = ["src", "tests", "tools"]

[artifacts.runtime]
kind  = "object"
entry = "src/rt/rt.coil"
out   = "build/release/aot-runtime.o"

[test]
roots    = ["tests"]
suffixes = ["-test.coil"]

[lint]
rules = ["aot.lint.unused-imports", "aot.lint.layout", "aot.lint.cond", "aot.lint.ctor"]
