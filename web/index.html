<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore aot-take-2 sea-of-nodes graphs in the browser.">
  <title>AOT Graph Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark">AOT</span><span>Graph Lab</span></div>
    <div class="phase-switch" role="group" aria-label="Compiler phase">
      <button data-phase="0">Parsed</button>
      <button class="active" data-phase="1">Optimized</button>
    </div>
    <button id="compile" class="primary">Compile graph</button>
    <span id="status">Loading Coil compiler…</span>
  </header>

  <main>
    <aside class="source-panel">
      <div class="panel-title"><span>Source</span><button id="reset-source" class="quiet">Object property</button></div>
      <textarea id="source" spellcheck="false" aria-label="JavaScript source"></textarea>
      <div class="source-footer"><kbd>⌘</kbd><kbd>↵</kbd><span>compile</span></div>
    </aside>

    <section class="graph-panel">
      <div class="toolbar">
        <div class="presets" role="group" aria-label="Graph view">
          <button data-preset="control" class="active">Control</button>
          <button data-preset="values">Values</button>
          <button data-preset="memory">Memory</button>
          <button data-preset="all">All</button>
        </div>
        <label class="search"><span>⌕</span><input id="search" placeholder="node id or label" autocomplete="off"></label>
        <button id="fit">Fit</button>
        <button id="clear-focus" disabled>Clear focus</button>
      </div>
      <div id="stage">
        <canvas id="graph"></canvas>
        <div id="empty-state">Compile a program to see its ideal graph.</div>
        <div class="legend">
          <span><i class="control"></i>control</span>
          <span><i class="value"></i>value</span>
          <span><i class="memory"></i>memory</span>
          <span><i class="dynamic"></i>dynamic</span>
          <span><i class="gc"></i>GC</span>
        </div>
      </div>
      <footer class="graph-footer">
        <span id="counts">0 nodes · 0 edges</span>
        <span>drag to pan · scroll to zoom · click to inspect · double-click to focus</span>
      </footer>
    </section>

    <aside class="detail-panel">
      <div class="panel-title"><span>Inspector</span></div>
      <div id="inspector" class="inspector-empty">Select a node to inspect its inputs and uses.</div>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
